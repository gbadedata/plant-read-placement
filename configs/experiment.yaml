# Experiment settings. Anything not set here falls back to prp/config.py DEFAULT_EXPERIMENT.
# This file is hashed into the preregistration lock: change it before `prp freeze`, not after.
seed: 20261114
workdir: work

regions:
  block_size: 1000000        # 1 Mb blocks; each panel-species block goes to exactly one split
  min_contig: 50000          # ignore scaffolds shorter than this
  fractions: {train: 0.8, val: 0.1, test: 0.1}

simulate:
  backend: badread           # `builtin` is the fast fallback; results must then say so
  reads: {train: 3000, val: 1000, test: 1000}   # per species per split (held-out species: their split only)
  min_length: 1000
  oversample: 1.3            # Badread cannot target an exact read count; simulate extra and subsample
  badread:
    executable: badread
    # Noisy, R9-era-like reads: mean identity 92% (max 98%, sd 3%), mean length 8 kb. Badread keeps its
    # default junk/random reads, chimeras and adapters, which is realistic; junk/random reads are
    # excluded from training labels but kept in evaluation. If your Badread lacks the 2023 models,
    # use nanopore2020.
    args: ["--error_model", "nanopore2023", "--qscore_model", "nanopore2023",
           "--identity", "92,98,3", "--length", "8000,6000"]
    mean_length: 8000

windows: {size: 512, max_per_read: 8}   # PlantCaduceus context is 512 bp

encoders:
  kmer: {type: kmer, k: 5}
  plantcad:
    type: plantcad
    model: kuleshov-group/PlantCaduceus_l20   # 20M parameters; try _l32 (225M) if time allows
    batch_size: 64
    amp: fp16      # Kaggle/Colab T4 has no bf16; `prp gpu-check` refuses fp16 if it disagrees with fp32 (then use none)
    device: cuda
  # PlantCAD2 accepts up to 8,192 bp, which suits long reads. Check the exact Hugging Face model id on
  # https://github.com/plantcad/plantcad before enabling, and raise windows.size if you use it.
  # plantcad2:
  #   {type: plantcad, model: <PlantCAD2-Small HF id>, batch_size: 8, amp: bf16, device: cuda}

head:
  hidden: 512
  out_dim: 128
  dropout: 0.1
  temperature: 0.1
  lambda_genus: 0.5          # hierarchical SupCon: pull congeners together
  lambda_family: 0.25
  species_per_batch: 0       # 0 = all panel species in every batch
  reads_per_species: 16
  steps: 3000
  lr: 1.0e-3
  weight_decay: 1.0e-4
  eval_every: 250
  device: auto

finetune:
  encoder: plantcad
  # Unfreeze the top four blocks and the final norm. Caduceus names them caduceus.backbone.layers.<i>
  # and caduceus.backbone.norm_f (modeling_caduceus.py); 16-19 assumes the 20-layer l20 model.
  # `prp gpu-check` prints the real layer count and a suggested pattern if this does not match.
  trainable_regex: ["layers\\.(1[6-9])\\.", "norm_f"]
  # Attempt 1 (18 Nov 2026; 1 window per read, lr_backbone 2e-5) did not adapt the encoder: training
  # loss fell from 7.55 (untrained) to about 6.85 by step 250 and stayed there, and its features gave
  # the same validation score as the frozen model (0.569 both). This is the single pre-committed retry
  # (see PREREG.md, development log), run as plantcad_adapted_r2 -> features plantcad_ft2:
  #   - 3 windows per read: attempt 1 peaked at 3.9 GiB for 52 windows, so 156 should need about 11 GiB
  #     of the T4's 14.5. If the first step still runs out of memory, the batch is halved and logged.
  #   - lr_backbone 1e-4 (5x): 2e-5 barely moved the weights in 3,000 steps.
  windows_per_read: 3
  monitor_windows: 4
  species_per_batch: 0
  reads_per_species: 4
  steps: 3000
  lr_backbone: 1.0e-4
  lr_head: 1.0e-3
  eval_every: 250

evaluation:
  specimen_sizes: [1, 10, 50]       # reads per specimen
  max_specimens_per_species: 200
  bootstrap: 2000
  identity_bins: [0.0, 0.88, 0.92, 0.96, 1.0]
  length_bins: [0, 2000, 5000, 10000, 1000000000]

minimap2: {preset: map-ont, threads: 16}
