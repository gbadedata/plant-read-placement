[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "plant-read-placement"
version = "0.1.0"
description = "Place plant specimens from noisy Nanopore reads with a plant DNA language model, benchmarked against minimap2 and k-mer baselines under a frozen preregistration."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Oluwagbade Odimayo" }]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "pyyaml>=6.0",
  "torch>=2.1",
  "scikit-learn>=1.3",
  "matplotlib>=3.7",
  "tabulate>=0.9",
  "mappy>=2.26",
]

[project.optional-dependencies]
plantcad = ["transformers>=4.40", "huggingface_hub>=0.23"]
dev = ["pytest>=7", "ruff>=0.4"]

[project.scripts]
prp = "prp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 150
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["B008"]
